<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スーパー・スター・ブラザーズ (スクリーンセーバー版)</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;width:100%;height:100%}
  canvas{
    image-rendering:pixelated;
    width:100vw;height:100vh;
    display:block;
    /* 画面を維持するため */
    position:fixed;top:0;left:0;
  }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=540;
let t=0,shake=0,flash=0;
let hiScore=0;
const RAINBOW=h=>`hsl(${(t*4+h)%360},100%,60%)`;

// ---------- 状態(スクリーンセーバー:常にデモ) ----------
let mode='demo'; // 常にデモ
let konamiIdx=0, rainbow=false;
let score=0, lives=3, invincible=0, weaponLvl=1, shield=0;
let player, bullets=[], ebullets=[], enemies=[], parts=[], drops=[], stars=[];
let spawnTimer=0, bossTimer=0, boss=null, scrollSpeed=3;

// 星の背景(3層パララックス)
for(let i=0;i<120;i++)stars.push({x:Math.random()*W,y:Math.random()*H,l:Math.random()*3|0});

function resetPlayer(){
  player={x:100,y:H/2,vx:0,vy:0,cool:0,dead:0};
  invincible=120;
}
function resetGame(){
  score=0;lives=3;weaponLvl=1;shield=0;
  bullets=[];ebullets=[];enemies=[];parts=[];drops=[];boss=null;
  spawnTimer=0;bossTimer=0;scrollSpeed=3;
  resetPlayer();
}

// ---------- 入力:スクリーンセーバーなので完全に無効化 ----------
// キーボード/マウス/タッチは一切反応しない
// (ブラウザのデフォルト動作も抑止)
addEventListener('keydown',e=>e.preventDefault(),{passive:false});
addEventListener('keyup',e=>e.preventDefault(),{passive:false});
addEventListener('mousedown',e=>e.preventDefault(),{passive:false});
addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
addEventListener('wheel',e=>e.preventDefault(),{passive:false});

function bigFlash(){flash=20;shake=15;}

// ---------- 爆発 ----------
function explode(x,y,n=20,col='#fff',big=false){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*(big?7:4)+1;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*20,
      col:col||(rainbow?RAINBOW(Math.random()*360):`hsl(${Math.random()*60+10},100%,60%)`),
      r:Math.random()*3+1.5});
  }
  if(big){shake=Math.max(shake,10);flash=Math.max(flash,6);}
}

// ---------- 敵 ----------
function spawnEnemy(){
  const r=Math.random();
  if(r<0.4){
    enemies.push({type:0,x:W+30,y:30+Math.random()*(H-60),vx:-2-Math.random()*1.5,vy:0,hp:1,r:14,cool:60+Math.random()*60,ph:Math.random()*7});
  }else if(r<0.7){
    enemies.push({type:1,x:W+30,y:60+Math.random()*(H-120),vx:-2.5,vy:0,hp:2,r:15,cool:90,ph:Math.random()*7,baseY:0});
    enemies[enemies.length-1].baseY=enemies[enemies.length-1].y;
  }else if(r<0.9){
    enemies.push({type:2,x:W+30,y:Math.random()*H,vx:-3,vy:0,hp:1,r:12,cool:0,ph:0});
  }else{
    enemies.push({type:3,x:W+30,y:60+Math.random()*(H-120),vx:-1.2,vy:0,hp:6,r:22,cool:120,ph:0});
  }
}

function spawnBoss(){
  boss={x:W+80,y:H/2,hp:60,maxHp:60,r:45,ph:0,cool:0,vy:0};
}

// ---------- 更新 ----------
function update(){
  t++;
  if(shake>0)shake*=0.9;
  if(flash>0)flash--;
  if(invincible>0)invincible--;
  if(shield>0)shield--;

  // 星
  for(const s of stars){
    s.x-=scrollSpeed*(s.l+1)*0.6;
    if(s.x<-5){s.x=W+5;s.y=Math.random()*H;}
  }
  // パーティクル
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx;p.y+=p.vy;p.vx*=0.96;p.vy*=0.96;p.life--;
    if(p.life<=0)parts.splice(i,1);
  }

  const isDemo=true; // 常にデモ
  const active=true;

  // ---- AI プレイヤー移動 ----
  if(player.dead<=0){
    let target=null,bd=1e9;
    for(const e of enemies){const d=Math.abs(e.x-player.x);if(d<bd&&e.x>player.x){bd=d;target=e;}}
    if(boss){const d=boss.x-player.x;if(d<bd){bd=d;target=boss;}}
    if(target){
      player.x+=Math.sign(target.x-player.x)*2.2;
      player.y+=Math.sign(target.y-player.y)*2.2;
    }
    // 敵弾回避
    for(const b of ebullets){
      const dx=b.x-player.x,dy=b.y-player.y,d=Math.hypot(dx,dy);
      if(d<120&&b.vx<0){player.y+=Math.sign(dy)*4.5;player.x+=Math.sign(dx)*1.5;}
    }
    // 自動発砲
    if(player.cool>0)player.cool--;
    if(player.cool<=0){
      player.cool=weaponLvl>=3?7:9;
      bullets.push({x:player.x+25,y:player.y,vx:11,vy:0});
      if(weaponLvl>=2){bullets.push({x:player.x+20,y:player.y-8,vx:11,vy:-1.5});bullets.push({x:player.x+20,y:player.y+8,vx:11,vy:1.5});}
      if(weaponLvl>=3){bullets.push({x:player.x+15,y:player.y-14,vx:11,vy:-3});bullets.push({x:player.x+15,y:player.y+14,vx:11,vy:3});}
    }
    player.x=Math.max(20,Math.min(W*0.6,player.x));
    player.y=Math.max(20,Math.min(H-20,player.y));
  }

  // ---- 敵スポーン ----
  spawnTimer--;
  if(spawnTimer<=0&&!boss){spawnEnemy();spawnTimer=Math.max(20,70-t/50);}
  bossTimer--;
  if(bossTimer<=0&&!boss){spawnBoss();bossTimer=900;bigFlash();}

  // ---- 敵更新 ----
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.ph+=0.08;
    if(e.type===0){e.x+=e.vx;e.y+=Math.sin(e.ph)*1.5;}
    if(e.type===1){e.x+=e.vx;e.y=e.baseY+Math.sin(e.ph*1.5)*40;}
    if(e.type===2){
      const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
      e.vx+=(dx/d)*0.15;e.vy+=(dy/d)*0.15;
      const sp=Math.hypot(e.vx,e.vy);if(sp>3.5){e.vx*=3.5/sp;e.vy*=3.5/sp;}
      e.x+=e.vx;e.y+=e.vy;
    }
    if(e.type===3){e.x+=e.vx;e.y+=Math.sin(e.ph)*0.8;}
    if(e.cool>0)e.cool--;
    if(e.cool<=0&&e.x<W-20&&e.x>player.x+50){
      e.cool=e.type===3?100:70+Math.random()*60;
      const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
      ebullets.push({x:e.x,y:e.y,vx:dx/d*4.5,vy:dy/d*4.5,r:e.type===3?7:4});
      if(e.type===3){
        for(let a=-1;a<=1;a+=2)ebullets.push({x:e.x,y:e.y,vx:dx/d*4.5+a*1.5,vy:dy/d*4.5,r:5});
      }
    }
    if(e.x<-50){enemies.splice(i,1);continue;}
    if(player.dead<=0&&Math.hypot(e.x-player.x,e.y-player.y)<e.r+12){
      enemies.splice(i,1);explode(e.x,e.y,25);
      hitPlayer();
    }
  }

  // ---- ボス ----
  if(boss){
    boss.ph+=0.03;
    if(boss.x>W-120)boss.x-=2;
    boss.y=H/2+Math.sin(boss.ph*2)*120;
    boss.cool--;
    if(boss.cool<=0){
      boss.cool=50;
      for(let a=0;a<8;a++){
        const ang=boss.ph*3+a*Math.PI/4;
        ebullets.push({x:boss.x,y:boss.y,vx:Math.cos(ang)*3.5,vy:Math.sin(ang)*3.5,r:6});
      }
      const dx=player.x-boss.x,dy=player.y-boss.y,d=Math.hypot(dx,dy)||1;
      ebullets.push({x:boss.x,y:boss.y,vx:dx/d*6,vy:dy/d*6,r:8});
    }
    if(player.dead<=0&&Math.hypot(boss.x-player.x,boss.y-player.y)<boss.r+12){
      hitPlayer();
    }
    if(boss.hp<=0){
      score+=5000;explode(boss.x,boss.y,80,'#ff0',true);
      drops.push({x:boss.x,y:boss.y,type:'P',t:0});
      drops.push({x:boss.x,y:boss.y+30,type:'S',t:0});
      boss=null;bigFlash();
    }
  }

  // ---- 弾 ----
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx;b.y+=b.vy;
    if(b.x>W+10||b.y<-10||b.y>H+10){bullets.splice(i,1);continue;}
    let hit=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(Math.hypot(b.x-e.x,b.y-e.y)<e.r){
        e.hp--;hit=true;
        explode(b.x,b.y,4,'#8ef',false);
        if(e.hp<=0){
          score+=[100,200,150,500][e.type];
          explode(e.x,e.y,20+e.type*8);
          if(Math.random()<0.25)drops.push({x:e.x,y:e.y,type:Math.random()<0.6?'P':'S',t:0});
          enemies.splice(j,1);
        }
        break;
      }
    }
    if(!hit&&boss&&Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r){
      boss.hp--;hit=true;explode(b.x,b.y,4,'#f88');
    }
    if(hit)bullets.splice(i,1);
  }
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];b.x+=b.vx;b.y+=b.vy;
    if(b.x<-10||b.x>W+10||b.y<-10||b.y>H+10){ebullets.splice(i,1);continue;}
    if(player.dead<=0&&Math.hypot(b.x-player.x,b.y-player.y)<b.r+10){
      ebullets.splice(i,1);
      if(shield>0){shield=0;explode(player.x,player.y,15,'#0ff');}
      else hitPlayer();
    }
  }

  // ---- ドロップ ----
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];d.x-=2;d.t++;
    if(d.x<-20){drops.splice(i,1);continue;}
    if(Math.hypot(d.x-player.x,d.y-player.y)<25){
      if(d.type==='P'){weaponLvl=Math.min(5,weaponLvl+1);score+=300;explode(d.x,d.y,12,'#f0f');}
      else{shield=600;score+=300;explode(d.x,d.y,12,'#0ff');}
      drops.splice(i,1);
    }
  }

  // ---- プレイヤー死亡(デモ:即リセット) ----
  if(player.dead>0){
    player.dead--;
    if(player.dead<=0){
      resetPlayer(); // デモなので即リセット、ゲームオーバーにならない
    }
  }

  // スコア上限防止(overflow対策)
  if(score>9999999)score=0;
}

function hitPlayer(){
  if(invincible>0)return;
  // デモ:即リセットで永遠に続く
  explode(player.x,player.y,30,'#fff',true);
  resetPlayer();
}

// ---------- 描画 ----------
function drawShip(x,y,ghost){
  ctx.save();ctx.translate(x,y);
  const fl=8+Math.sin(t*0.5)*3;
  ctx.fillStyle=rainbow?RAINBOW(0):'#f80';
  ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(-18-fl,4);ctx.lineTo(-18-fl*1.6,0);ctx.lineTo(-18-fl,-4);ctx.fill();
  ctx.fillStyle=rainbow?RAINBOW(60):'#ff0';
  ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(-18-fl*0.6,2);ctx.lineTo(-18-fl,0);ctx.lineTo(-18-fl*0.6,-2);ctx.fill();
  ctx.fillStyle=ghost?'rgba(255,255,255,0.3)':'#0cf';
  ctx.beginPath();ctx.moveTo(24,0);ctx.lineTo(0,-10);ctx.lineTo(-18,-7);ctx.lineTo(-12,0);ctx.lineTo(-18,7);ctx.lineTo(0,10);ctx.fill();
  ctx.fillStyle=ghost?'rgba(255,255,255,0.3)':'#fff';
  ctx.beginPath();ctx.moveTo(24,0);ctx.lineTo(2,0);ctx.lineTo(-12,0);ctx.lineTo(2,3);ctx.fill();
  ctx.fillStyle=ghost?'rgba(255,255,255,0.3)':'#f0f';
  ctx.fillRect(-14,-14,10,5);ctx.fillRect(-14,9,10,5);
  if(shield>0&&!ghost){
    ctx.strokeStyle=`rgba(0,255,255,${0.4+Math.sin(t*0.3)*0.3})`;
    ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.stroke();
  }
  ctx.restore();
}

function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);
  const c=rainbow?RAINBOW(e.ph*50):['#f44','#4f4','#ff4','#f4f'][e.type];
  if(e.type===0){
    ctx.fillStyle=c;
    ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(10,-10);ctx.lineTo(14,0);ctx.lineTo(10,10);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-2,0,3,0,7);ctx.fill();
  }else if(e.type===1){
    ctx.fillStyle=c;
    ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(0,-13);ctx.lineTo(-14,0);ctx.lineTo(0,13);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.fill();
  }else if(e.type===2){
    ctx.fillStyle=c;
    ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(0,0,5+Math.sin(t*0.3)*2,0,7);ctx.fill();
  }else{
    ctx.fillStyle=c;
    ctx.beginPath();
    for(let i=0;i<6;i++){const a=i*Math.PI/3+e.ph;const r=i%2?14:22;
      i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);}
    ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();
    ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.fill();
  }
  ctx.restore();
}

function drawBoss(){
  ctx.save();ctx.translate(boss.x,boss.y);
  const c=rainbow?RAINBOW(t):'#f0f';
  ctx.fillStyle=c;
  ctx.beginPath();
  for(let i=0;i<12;i++){const a=i*Math.PI/6+boss.ph*2;const r=i%2?25:45;
    i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);}
  ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,0,20,0,7);ctx.fill();
  ctx.fillStyle='#f00';
  ctx.beginPath();ctx.arc(0,0,10+Math.sin(t*0.2)*4,0,7);ctx.fill();
  ctx.restore();
  ctx.fillStyle='#f00';ctx.fillRect(W/2-150,20,300,10);
  ctx.fillStyle='#f0f';ctx.fillRect(W/2-150,20,300*boss.hp/boss.maxHp,10);
  ctx.strokeStyle='#fff';ctx.strokeRect(W/2-150,20,300,10);
}

function drawText(txt,x,y,size,col,align='center'){
  ctx.font=`bold ${size}px "Courier New",monospace`;
  ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.fillStyle='#000';ctx.fillText(txt,x+3,y+3);
  ctx.fillStyle=col;ctx.fillText(txt,x,y);
}

function draw(){
  ctx.save();
  if(shake>0.5)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  const g=ctx.createLinearGradient(0,0,0,H);
  if(rainbow){g.addColorStop(0,RAINBOW(0));g.addColorStop(1,RAINBOW(180));}
  else{g.addColorStop(0,'#000022');g.addColorStop(0.5,'#000044');g.addColorStop(1,'#110022');}
  ctx.globalAlpha=rainbow?0.3:1;
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.globalAlpha=1;

  for(const s of stars){
    const cols=['#446','#88a','#fff'];
    ctx.fillStyle=rainbow?RAINBOW(s.x):cols[s.l];
    const sz=s.l===2?2.5:s.l===1?1.8:1.2;
    ctx.fillRect(s.x,s.y,sz,sz);
  }

  for(const d of drops){
    const pulse=1+Math.sin(d.t*0.2)*0.2;
    ctx.save();ctx.translate(d.x,d.y);ctx.scale(pulse,pulse);
    ctx.fillStyle=d.type==='P'?'#f0f':'#0ff';
    ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fill();
    ctx.fillStyle='#fff';drawText(d.type,0,1,14,'#fff');
    ctx.restore();
  }

  for(const e of enemies)drawEnemy(e);
  if(boss)drawBoss();

  for(const b of bullets){
    ctx.fillStyle=rainbow?RAINBOW(b.x):'#ff0';
    ctx.fillRect(b.x-8,b.y-2,14,4);
    ctx.fillStyle='#fff';ctx.fillRect(b.x-2,b.y-1,6,2);
  }
  for(const b of ebullets){
    ctx.fillStyle=rainbow?RAINBOW(b.x+180):'#f44';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.4,0,7);ctx.fill();
  }

  if(player.dead<=0){
    if(invincible>0&&t%6<3)drawShip(player.x,player.y,true);
    else drawShip(player.x,player.y,false);
  }

  for(const p of parts){
    ctx.globalAlpha=Math.min(1,p.life/15);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;

  // HUD(スクリーンセーバー用:DEMO表示)
  drawText(`SCORE ${String(score).padStart(7,'0')}`,15,25,20,'#fff','left');
  drawText(`HI ${String(Math.max(hiScore,score)).padStart(7,'0')}`,W-15,25,20,'#ff0','right');
  drawText(`POWER ${'★'.repeat(weaponLvl)}${'☆'.repeat(5-weaponLvl)}`,15,50,16,'#f0f','left');
  for(let i=0;i<lives-1;i++)drawShip(30+i*40,H-25,false);
  if(t%60<40)drawText('DEMO',W/2,30,28,RAINBOW(90));

  // フラッシュ
  if(flash>0){
    ctx.fillStyle=`rgba(255,255,255,${flash/25})`;
    ctx.fillRect(-20,-20,W+40,H+40);
  }
  // スキャンライン
  ctx.fillStyle='rgba(0,0,0,0.12)';
  for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,2);
  ctx.restore();
}

// ---------- メインループ ----------
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
resetGame();
loop();
</script>
</body>
</html>
